// 项目依赖的插件，必须写在最前面
pluginManagement {
    repositories {
        google()       // 关键：告诉 Gradle 去 Google 仓库找 AGP
        mavenCentral()
        gradlePluginPortal()
    }
}

includeBuild("build-logic")

dependencyResolutionManagement {
    // 这行代码表示：如果子模块里自己写了 repositories {}，构建直接报错
    // 强制所有模块必须统一使用这里的仓库配置
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral() // Kotlin 标准库主要托管在这里
        // ... 其他 maven 地址
        maven { url 'https://jitpack.io' }
        maven { url "https://oss.jfrog.org/libs-snapshot" }
        maven { url "https://s01.oss.sonatype.org/content/groups/public" }
    }
}

rootProject.name = 'MatrixAndroid'
include ':app'
include ':thread'
include ':common'
include ':view'
include ':apt-processor'
include ':apt-annotation'
include ':myself'
include ':kt'
include ':coroutine'
include ':service'
include ':compose'
